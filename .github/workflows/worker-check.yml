# Every 5 minutes: ask the app whether the PC worker has sent a heartbeat in the last 5 minutes.
# The endpoint opens an "offline" alert (shown on /admin) when it has not, and resolves it when the worker is back.
# Setup: repository secret CRON_SECRET = the same value as CRON_SECRET in the Vercel project.
# Until that secret exists the job exits successfully without calling anything.
# Note: GitHub may start scheduled runs a few minutes late, and pauses schedules after 60 days without repo activity.
name: Worker heartbeat check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: worker-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/worker-check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://panel-bom-pricer.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET is not set - skipping."
            exit 0
          fi
          code=$(curl -sS -m 30 -o response.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/worker-check")
          cat response.json; echo
          test "$code" = "200"
